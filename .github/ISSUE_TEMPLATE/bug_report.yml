name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a post with a video
        2. Tap Share
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Postcrate version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, iOS]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: Pixel 8, Android 16
  - type: input
    id: target
    attributes:
      label: App you shared to (if relevant)
      placeholder: Instagram
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
